<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="mask-icon" href="%sveltekit.assets%/favicon.svg" color="#7c7cf2" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Warm up the analytics connection (the gtag script below is async) -->
		<link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
		<link rel="dns-prefetch" href="https://www.google-analytics.com" />

		<!-- Google tag (gtag.js) -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-33T8739N15"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag('js', new Date());

			gtag('config', 'G-33T8739N15');
		</script>

		<!-- Default <title> + primary meta. This static title is what every
		     prerendered page ships with; /mixer and /models swap in a per-route
		     title client-side via <svelte:head> (they render with ssr=false). -->
		<title>Chromatics — color as code</title>
		<meta
			name="description"
			content="Chromatics is a scriptable color language and interactive studio. Write a tiny program that derives a whole palette from one brand color, inspect any color across ~100 color models, check accessibility (WCAG + APCA), and preview it on real UI — all in the browser. OKLCH-native."
		/>
		<meta name="author" content="Andraž Mesarič-Sirec" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-title" content="Chromatics" />
		<meta name="apple-mobile-web-app-capable" content="yes" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Chromatics" />
		<meta property="og:title" content="Chromatics — color as code" />
		<meta
			property="og:description"
			content="A scriptable color language and interactive studio. Derive whole palettes from one brand color, inspect ~100 color models, check accessibility, and preview on real UI — all in the browser."
		/>
		<meta property="og:url" content="https://lilbunnyrabbit.github.io/chromatics/" />
		<meta property="og:image" content="https://lilbunnyrabbit.github.io/chromatics/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="Chromatics — a scriptable color language and interactive studio"
		/>

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Chromatics — color as code" />
		<meta
			name="twitter:description"
			content="A scriptable color language and interactive studio. Derive whole palettes from one brand color, inspect ~100 color models, check accessibility, and preview on real UI."
		/>
		<meta name="twitter:image" content="https://lilbunnyrabbit.github.io/chromatics/og.png" />

		<!-- Structured data: identify the site as a free in-browser developer/design tool -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@graph": [
					{
						"@type": "WebApplication",
						"name": "Chromatics",
						"url": "https://lilbunnyrabbit.github.io/chromatics/",
						"description": "A scriptable color language and interactive studio — derive a whole palette from one brand color, inspect ~100 color models, check WCAG + APCA accessibility, and preview on real UI. OKLCH-native.",
						"applicationCategory": "DeveloperApplication",
						"operatingSystem": "Any (web browser)",
						"browserRequirements": "Requires JavaScript",
						"image": "https://lilbunnyrabbit.github.io/chromatics/og.png",
						"author": { "@type": "Person", "name": "Andraž Mesarič-Sirec" },
						"offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
					},
					{
						"@type": "WebSite",
						"name": "Chromatics",
						"url": "https://lilbunnyrabbit.github.io/chromatics/"
					}
				]
			}
		</script>

		<script>
			// No-flash theme: apply the saved theme before first paint.
			try {
				var t = localStorage.getItem('chromatics:theme') || 'light';
				document.documentElement.setAttribute('data-theme', t);
			} catch (e) {
				document.documentElement.setAttribute('data-theme', 'light');
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

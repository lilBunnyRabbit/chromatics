<style>

  --mono: Hack, Consolas, monospace;

* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg-darkest); font-family: Inter, sans-serif; color: var(--fg); position: relative; }
.ears { fill: var(--primary); }
.cot { color: var(--cottontail); }
.glow { position: absolute; inset: 0; pointer-events: none; }

.glow { background: radial-gradient(50% 60% at 15% 20%, oklch(0.745 0.0699 122.47 / 0.12), transparent 70%); }
.head { position: absolute; left: 64px; top: 56px; display: flex; align-items: center; gap: 16px; }
.head .ears { width: 52px; }
.head h1 { font-size: 44px; font-weight: 800; color: var(--cottontail); }
.head span { font: 18px var(--mono); color: var(--dim); margin-left: 8px; }
.head span b { color: var(--primary); font-weight: 400; }
.ed { position: absolute; left: 64px; top: 150px; width: 430px; height: 400px; border-radius: 18px; background: var(--bg-darker); border: 1px solid var(--bg-lighter); padding: 26px 28px; font: 19px/2 var(--mono); }
.ed .n { color: var(--bg-lightest); margin-right: 18px; }
.k { color: var(--primary); } .s { color: var(--accent); } .f { color: var(--secondary); }
.arrow { position: absolute; left: 512px; top: 330px; font-size: 42px; color: var(--primary); }
.grid { position: absolute; left: 576px; top: 150px; width: 560px; height: 400px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.grid i { display: block; border-radius: 10px; }

name: CI

on:
  push:
  pull_request:

jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      # --affected diffs against the base branch (pull requests) or the pushed range, so it needs history.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # The package runs its suite on node and bun (ADR-008).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run lint

      - name: Check, test, build
        run: bunx turbo run check test build --affected

name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing (OIDC): no NPM_TOKEN (ADR-007).
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Bun can't publish with OIDC or provenance yet (oven-sh/bun#22423, #15601), so `changeset publish`
      # runs `npm publish`: the runner's preinstalled npm, upgraded for trusted publishing (11.5.1 or later).
      # That step is the only npm in the release; everything else runs on Bun.
      - name: Update npm
        run: npm install -g npm@12.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version PR or publish
        uses: changesets/action@v2.1.2
        with:
          version-script: bun --bun x changeset version
          publish-script: bun run release
          github-token: ${{ secrets.GITHUB_TOKEN }}
